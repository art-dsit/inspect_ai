<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Inspect AI — Pyodide Demo</title>
  <style>
    body { font-family: monospace; margin: 2rem; background: #1e1e2e; color: #cdd6f4; }
    h1 { color: #89b4fa; }
    #status { white-space: pre-wrap; margin-top: 1rem; max-height: 80vh; overflow-y: auto; }
    .ok  { color: #a6e3a1; }
    .err { color: #f38ba8; }
    .info { color: #94e2d5; }
    button { font-family: monospace; font-size: 1rem; padding: 0.5rem 1.5rem;
             background: #89b4fa; color: #1e1e2e; border: none; cursor: pointer;
             border-radius: 4px; margin-top: 1rem; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    a.view-link { display: inline-block; margin-top: 0.5rem; padding: 0.5rem 1.5rem;
                  background: #a6e3a1; color: #1e1e2e; text-decoration: none;
                  border-radius: 4px; font-weight: bold; }
    a.view-link:hover { background: #94e2d5; }
  </style>
</head>
<body>
  <h1>Inspect AI in the Browser (Pyodide)</h1>
  <p>Runs a minimal eval using <code>mockllm</code> — no real API calls, no sandbox.</p>
  <p><em>Serve this page with <code>python serve.py</code> from the _pyodide directory.</em></p>
  <button id="run" onclick="runDemo()">Run Eval</button>
  <div id="status"></div>

  <script src="https://cdn.jsdelivr.net/pyodide/v0.27.5/full/pyodide.js"></script>
  <script>
    const statusEl = document.getElementById('status');
    const runBtn   = document.getElementById('run');

    function log(msg, cls = 'info') {
      const span = document.createElement('span');
      span.className = cls;
      span.textContent = msg + '\n';
      statusEl.appendChild(span);
      statusEl.scrollTop = statusEl.scrollHeight;
    }

    /**
     * Write a dict of {relative_path: content} into Pyodide's virtual FS
     * under site-packages/.
     */
    function writeSourceToFS(pyodide, sourceFiles) {
      const FS = pyodide.FS;

      function ensureDir(path) {
        const parts = path.split('/').filter(Boolean);
        let current = '';
        for (const part of parts) {
          current += '/' + part;
          try { FS.stat(current); } catch { try { FS.mkdir(current); } catch {} }
        }
      }

      const sitePkgPath = pyodide.runPython(`
import site, sys
paths = site.getsitepackages()
paths[0] if paths else sys.prefix + '/lib/python' + '.'.join(map(str, sys.version_info[:2])) + '/site-packages'
      `);

      let count = 0;
      for (const [relPath, content] of Object.entries(sourceFiles)) {
        const fullPath = sitePkgPath + '/' + relPath;
        const dir = fullPath.substring(0, fullPath.lastIndexOf('/'));
        ensureDir(dir);
        FS.writeFile(fullPath, content);
        count++;
      }
      return { count, sitePkgPath };
    }

    async function runDemo() {
      runBtn.disabled = true;
      statusEl.innerHTML = '';

      try {
        // 1. Load Pyodide
        log('[1/5] Loading Pyodide…');
        const pyodide = await loadPyodide();
        log('       Pyodide loaded.', 'ok');

        // 2. Install dependencies
        log('[2/5] Installing dependencies…');
        await pyodide.loadPackage([
          'micropip', 'pydantic', 'numpy', 'sqlite3',
          'pygments', 'rich', 'zstandard', 'regex',
        ]);
        const micropip = pyodide.pyimport('micropip');
        await micropip.install([
          'anyio', 'sniffio', 'docstring-parser', 'jsonlines',
          'jsonpatch', 'jsonpath-ng', 'jsonref', 'jsonschema',
          'python-dotenv', 'pyyaml', 'semver', 'shortuuid',
          'tenacity', 'typing_extensions', 'httpx', 'click',
          'beautifulsoup4', 'fsspec', 'ijson', 'zipp',
          'python-dateutil', 'markdown-it-py', 'mdurl',
          'httpcore', 'h11', 'certifi', 'idna', 'charset-normalizer',
          'jsonpointer', 'ply',
        ]);
        log('       Dependencies installed.', 'ok');

        // 3. Fetch inspect_ai source
        log('[3/5] Fetching inspect_ai source…');
        const resp = await fetch('/inspect_ai_source.json');
        if (!resp.ok) throw new Error(`Failed to fetch source: ${resp.status} — are you using serve.py?`);
        const sourceFiles = await resp.json();
        log(`       Received ${Object.keys(sourceFiles).length} files.`, 'ok');

        // 4. Write source into virtual FS
        log('[4/5] Writing source into virtual filesystem…');
        const { count, sitePkgPath } = writeSourceToFS(pyodide, sourceFiles);
        log(`       Wrote ${count} files.`, 'ok');

        // Create minimal dist-info so importlib.metadata works
        pyodide.runPython(`
import os
dist_info = "${sitePkgPath}/inspect_ai-0.0.0.dev0.dist-info"
os.makedirs(dist_info, exist_ok=True)
with open(os.path.join(dist_info, "METADATA"), "w") as f:
    f.write("Metadata-Version: 2.1\\nName: inspect_ai\\nVersion: 0.0.0.dev0\\n")
with open(os.path.join(dist_info, "RECORD"), "w") as f:
    f.write("")
        `);

        // 5. Run the eval
        log('[5/5] Running eval with mockllm…');
        const result = await pyodide.runPythonAsync(`
import os
os.environ["INSPECT_LOG_DIR"] = "/tmp/inspect_logs"
os.environ["INSPECT_DISPLAY"] = "none"
os.environ.setdefault("INSPECT_LOG_LEVEL", "warning")

from inspect_ai import Task, eval_async
from inspect_ai.dataset import Sample
from inspect_ai.scorer import includes
from inspect_ai.solver import generate

task = Task(
    dataset=[Sample(input="What is 2+2?", target="4")],
    solver=[generate()],
    scorer=includes(),
)

results = await eval_async(task, model="mockllm/model", display="none")
r = results[0]
status = r.status
scores = str(r.results.scores) if r.results else "None"
f"status={status}, scores={scores}"
        `);
        log('');
        log('=== RESULT ===', 'ok');
        log(result, 'ok');

        // 6. Serialize the eval log and send to server for viewing
        log('');
        log('[6] Saving log for Inspect View…');
        const logJson = await pyodide.runPythonAsync(`
# eval_async() returns an EvalLog with lazy-loaded samples/reductions.
# The lazy loader calls asyncio.run() or uses anyio threads — both fail
# in Pyodide (no threads, already in event loop). Instead, re-read the
# .eval zip file synchronously using _read_log_from_bytes (pure zipfile).
from inspect_ai.log._recorders.eval import _read_log_from_bytes
from inspect_ai.log._file import eval_log_json_str
with open(results[0].location, "rb") as f:
    log = _read_log_from_bytes(f, results[0].location, header_only=False)
eval_log_json_str(log)
        `);
        const saveResp = await fetch('/save-log', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: logJson,
        });
        if (saveResp.ok) {
          const { view_url } = await saveResp.json();
          log('       Log saved.', 'ok');
          log('');
          const link = document.createElement('a');
          link.href = view_url;
          link.target = '_blank';
          link.className = 'view-link';
          link.textContent = 'View results in Inspect View \u2192';
          statusEl.appendChild(link);
          statusEl.appendChild(document.createTextNode('\n'));
          log(`       ${view_url}`, 'ok');
        } else {
          log('       Failed to save log: ' + saveResp.status, 'err');
        }

      } catch (e) {
        log('ERROR: ' + e.message, 'err');
        log('', 'err');
        log('Stack trace (also in browser console):', 'err');
        log(e.stack || '(no stack)', 'err');
        console.error(e);
      } finally {
        runBtn.disabled = false;
      }
    }
  </script>
</body>
</html>
